<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập cá nhân hoá — VLearn</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="Menu" title="Danh sách nhóm">☰</button>
    <div class="brand">🎓 <span>Ôn tập cá nhân hoá</span><span class="tag">VLearn</span></div>
    <div class="topbar-actions">
      <span class="mode-pill">Mock+AI · gpt-4o</span>
      <button class="icon-btn" id="themeToggle" title="Đổi giao diện sáng/tối">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="Cài đặt">⚙️</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="card dash-card" id="dashCard"></div>

      <div class="sidebar-search">
        <input type="text" id="groupSearch" placeholder="🔍 Tìm theo mã học viên hoặc bài giảng...">
        <select id="sortSelect">
          <option value="nocite_desc">Ưu tiên % không trích dẫn</option>
          <option value="turns_desc">Số lượt hỏi nhiều nhất</option>
          <option value="name_asc">Mã học viên A-Z</option>
        </select>
      </div>

      <div class="group-list" id="groupList"></div>
    </aside>

    <main class="main">
      <div class="group-header" id="groupHeader"></div>

      <div class="tabs">
        <button class="tab active" data-tab="turns">Lịch sử hỏi</button>
        <button class="tab" data-tab="review">Bản ôn tập</button>
        <button class="tab" data-tab="history">Đã lưu <span class="count-badge" id="historyCount">0</span></button>
      </div>

      <section class="tab-panel active" id="panel-turns">
        <div class="panel-toolbar">
          <div class="filter-group" id="citeFilter">
            <button class="chip active" data-filter="all">Tất cả</button>
            <button class="chip" data-filter="cited">Có trích dẫn</button>
            <button class="chip" data-filter="no_cite">Không trích dẫn</button>
          </div>
          <input type="text" id="turnSearch" placeholder="Tìm trong câu hỏi / câu trả lời...">
        </div>
        <div id="turnList"></div>
      </section>

      <section class="tab-panel" id="panel-review">
        <div class="review-toolbar">
          <button id="genBtn">✨ Sinh bản ôn tập</button>
          <button class="secondary" id="copyBtn" disabled>📋 Copy</button>
          <button class="secondary" id="downloadBtn" disabled>⬇️ Tải .md</button>
        </div>
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px;">
          Bản ôn tập được sinh <span class="mock-tag">gọi AI thật qua OpenRouter</span>
        </label>
        <div class="review-box empty" id="reviewBox">Bấm "Sinh bản ôn tập" để bắt đầu.</div>
      </section>

      <section class="tab-panel" id="panel-history">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px;">
          Các bản ôn tập đã sinh trước đó cho nhóm này (lưu trong trình duyệt — localStorage)
        </label>
        <div id="historyList"></div>
      </section>

      <div class="footer-note">
        Non-goals: không tự chấm điểm học viên · không sửa đè câu trả lời cũ của tutor · không bịa nội dung ngoài transcript.
      </div>
    </main>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Cài đặt</h3>
    <label>OpenRouter API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-...">
    <div class="checkbox-row">
      <input type="checkbox" id="rememberKey">
      <label for="rememberKey" style="margin:0;">Ghi nhớ key trong trình duyệt này (localStorage)</label>
    </div>
    <div class="hint">Nếu không tick, key chỉ dùng cho phiên hiện tại và không được lưu lại.</div>

    <label>Model</label>
    <select id="modelSelect">
      <option value="openai/gpt-4o">openai/gpt-4o (mặc định)</option>
      <option value="openai/gpt-4o-mini">openai/gpt-4o-mini (nhanh &amp; rẻ hơn)</option>
      <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet</option>
    </select>

    <div class="modal-actions">
      <button class="secondary" id="closeSettings">Đóng</button>
      <button id="saveSettings">Lưu</button>
    </div>
  </div>
</div>

<div class="citation-popover hidden" id="citationPopover"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
