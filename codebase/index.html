<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ôn tập cá nhân hoá — VLearn</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7f9; margin:0; padding:24px; color:#1a1a1a; }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color:#666; font-size:13px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:10px; padding:16px; margin-bottom:14px; }
  label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
  select, button { font-size:14px; padding:8px 12px; border-radius:6px; border:1px solid #ccc; }
  select { width:100%; margin-bottom:12px; }
  button { background:#2f6fed; color:#fff; border:none; cursor:pointer; font-weight:600; }
  button:disabled { background:#aaa; cursor:not-allowed; }
  button.secondary { background:#fff; color:#2f6fed; border:1px solid #2f6fed; }
  .turn { border-left:3px solid #ddd; padding:8px 12px; margin-bottom:8px; font-size:13px; background:#fafafa; border-radius:0 6px 6px 0; }
  .turn.no-cite { border-left-color:#e0554f; background:#fff5f4; }
  .turn.cited { border-left-color:#2fa85f; }
  .q { font-weight:600; margin-bottom:4px; }
  .a { color:#444; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .badge.no-cite { background:#fbdedc; color:#a33; }
  .badge.cited { background:#dcf3e3; color:#2a7a45; }
  .stats { font-size:13px; color:#555; margin-bottom:10px; }
  .review-box { background:#eef4ff; border:1px dashed #2f6fed; border-radius:8px; padding:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .mock-tag { font-size:11px; background:#fff3cd; color:#856404; padding:2px 8px; border-radius:8px; margin-left:8px; }
  .hidden { display:none; }
  .footer-note { font-size:12px; color:#999; margin-top:24px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 Ôn tập cá nhân hoá</h1>
  <div class="sub">Prototype — Mức: <b>Mock</b> (flow bấm được hết, lời gọi AI thật sẽ nối ở CP3)</div>

  <div class="card">
    <label>Chọn học viên · bài giảng (nhóm đã hỏi lại ≥3 lần)</label>
    <select id="groupSelect"></select>
    <div class="stats" id="stats"></div>
    <button id="genBtn">✨ Sinh bản ôn tập</button>
    <button class="secondary" id="rawBtn">Xem lịch sử hỏi gốc</button>
  </div>

  <div class="card hidden" id="rawCard">
    <label>Lịch sử các lượt hỏi trong bài này</label>
    <div id="turnList"></div>
  </div>

  <div class="card hidden" id="reviewCard">
    <label>Bản ôn tập được sinh <span class="mock-tag">MOCK — chưa gọi AI thật</span></label>
    <div class="review-box" id="reviewBox"></div>
  </div>

  <div class="footer-note">
    Non-goals: không tự chấm điểm học viên · không sửa đè câu trả lời cũ của tutor · không bịa nội dung ngoài transcript.
  </div>
</div>

<script>
let DATA = [];

fetch('demo_data.json').then(r => r.json()).then(data => {
  DATA = data;
  const groups = {};
  data.forEach(r => {
    const key = r.user_id + '||' + r.day_code;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const sel = document.getElementById('groupSelect');
  Object.keys(groups).forEach(key => {
    const [uid, dc] = key.split('||');
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${uid} · ${dc} (${groups[key].length} lượt hỏi)`;
    sel.appendChild(opt);
  });
  window.GROUPS = groups;
  renderGroup(sel.value);
});

document.getElementById('groupSelect').addEventListener('change', e => renderGroup(e.target.value));
document.getElementById('rawBtn').addEventListener('click', () => {
  document.getElementById('rawCard').classList.toggle('hidden');
});
document.getElementById('genBtn').addEventListener('click', () => generateReview(document.getElementById('groupSelect').value));

function renderGroup(key) {
  const turns = window.GROUPS[key];
  const noCiteCount = turns.filter(t => t.no_cite).length;
  document.getElementById('stats').textContent =
    `${turns.length} lượt hỏi trong bài này · ${noCiteCount} lượt (${Math.round(noCiteCount/turns.length*100)}%) tutor trả lời KHÔNG có trích dẫn`;

  const listEl = document.getElementById('turnList');
  listEl.innerHTML = '';
  turns.forEach(t => {
    const div = document.createElement('div');
    div.className = 'turn ' + (t.no_cite ? 'no-cite' : 'cited');
    div.innerHTML = `
      <div class="q">${escapeHtml(t.question_excerpt)} <span class="badge ${t.no_cite ? 'no-cite' : 'cited'}">${t.no_cite ? 'không trích dẫn' : 'có trích dẫn ' + t.citations}</span></div>
      <div class="a">${escapeHtml(t.answer_excerpt)}</div>
    `;
    listEl.appendChild(div);
  });

  document.getElementById('reviewCard').classList.add('hidden');
}

// ⚠️ CP3: cắm API key vào đây (KHÔNG commit key thật lên repo — dùng biến môi trường/prompt nhập tay khi demo)
const GEMINI_API_KEY = ""; // để trống -> UI sẽ nhắc nhập
const GEMINI_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

// Mapping day_code -> mã prefix transcript tương ứng (đã xác nhận qua nội dung khớp)
const DAY_CODE_TO_TRANSCRIPT_PREFIX = {
  'Lecture_material_ms203vsq_ob7vqp': ['T01', 'T05'], // Problem Statement, xác định bài toán kinh doanh cho AI
  'day02-c301': ['T02'], // Ma trận Tác động-Nỗ lực, vibe code, quick win
};
// CP3 cần load thật từ transcript-0X-clean.md (bổ sung khi có file).
// Cấu trúc: { "T04-012": "nội dung đoạn...", ... }
// TRANSCRIPT_CHUNKS: nội dung transcript sạch theo mã đoạn [Txx-NNN], nạp từ transcript_chunks.json
let TRANSCRIPT_CHUNKS = {};

async function loadTranscriptChunks() {
  try {
    const res = await fetch('transcript_chunks.json');
    TRANSCRIPT_CHUNKS = await res.json();
  } catch (e) {
    console.warn('Chưa có transcript_chunks.json — AI sẽ chạy ở chế độ không có nguồn thật (chỉ để test flow).');
  }
}
loadTranscriptChunks();

async function generateReview(key) {
  const turns = window.GROUPS[key];
  const [uid, dc] = key.split('||');
  const noCite = turns.filter(t => t.no_cite);
  const reviewBox = document.getElementById('reviewBox');
  const reviewCard = document.getElementById('reviewCard');
  reviewCard.classList.remove('hidden');

  // ② Lớp mơ hồ — day_code placeholder, không map được bài giảng
  if (dc === 'New learning material') {
    reviewBox.textContent = '⚠️ Chưa xác định được bài giảng cho nhóm này (day_code là placeholder hệ thống). Không thể sinh bản ôn tập có căn cứ — vui lòng chọn nhóm khác.';
    return;
  }

  // ② Lớp mơ hồ — chưa đủ dữ liệu
  if (turns.length < 3) {
    reviewBox.textContent = 'Chưa đủ dữ liệu (cần ≥3 lượt hỏi trong cùng bài giảng) để tổng hợp ôn tập có ý nghĩa cho nhóm này.';
    return;
  }

  if (!GEMINI_API_KEY) {
    const key2 = prompt('Nhập Gemini API key (free tier, không lưu lại, chỉ dùng cho phiên demo này):');
    if (!key2) {
      reviewBox.textContent = 'Cần API key để gọi AI thật. Chưa nhập key nên không thể sinh bản ôn tập.';
      return;
    }
    window.__RUNTIME_KEY = key2;
  }

  reviewBox.textContent = '⏳ Đang gọi AI thật, đối chiếu transcript...';

  const relevantPrefixes = DAY_CODE_TO_TRANSCRIPT_PREFIX[dc] || [];
  const contextChunks = Object.entries(TRANSCRIPT_CHUNKS)
    .filter(([code]) => relevantPrefixes.some(p => code.startsWith(p)))
    .map(([code, text]) => `[${code}] ${text}`)
    .join('\n\n');

  const questionsList = noCite.map(t => `- (${t.turn_id}) ${t.question_excerpt}`).join('\n');

  const systemInstruction = `Bạn là trợ lý tổng hợp ôn tập cho học viên. NGUYÊN TẮC BẮT BUỘC:
1. CHỈ dùng nội dung trong phần TRANSCRIPT được cung cấp bên dưới — không dùng kiến thức ngoài.
2. Nếu không tìm thấy đoạn transcript support cho một câu hỏi, PHẢI nói rõ "không tìm thấy căn cứ trong tài liệu" cho câu đó — không được bịa.
3. Mọi thông tin đưa ra phải kèm mã đoạn trích dẫn dạng [Txx-NNN] lấy từ transcript.
4. KHÔNG chấm điểm, đánh giá năng lực học viên. KHÔNG sửa nội dung transcript gốc, chỉ tóm tắt/trích dẫn.
5. Nếu TRANSCRIPT rỗng hoặc không đủ, báo rõ giới hạn này thay vì tự sinh nội dung.

TRANSCRIPT:
${contextChunks || '(không có transcript — báo rõ giới hạn này)'}

CÁC CÂU HỎI HỌC VIÊN ĐÃ HỎI LẠI NHIỀU LẦN (cần ôn tập):
${questionsList}

Hãy sinh bản ôn tập ngắn gọn, mỗi điểm kèm mã đoạn trích dẫn thật.`;

  try {
    const apiKey = GEMINI_API_KEY || window.__RUNTIME_KEY;
    const res = await fetch(`${GEMINI_ENDPOINT}?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: systemInstruction }] }]
      })
    });
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '(AI không trả về nội dung — kiểm tra API key/quota)';
    reviewBox.textContent = `📘 Ôn tập cho ${uid} — bài "${dc}"\n\n${text}`;
  } catch (err) {
    reviewBox.textContent = '❌ Lỗi khi gọi AI: ' + err.message + '\n(Kiểm tra API key hoặc kết nối mạng)';
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
